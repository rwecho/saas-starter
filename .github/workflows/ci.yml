name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/paypal-payments]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BASE_URL: http://localhost:3000
      AUTH_SECRET: ci-test-secret
      PAYPAL_ENVIRONMENT: sandbox
      PAYPAL_CLIENT_ID: ci-client-id
      PAYPAL_CLIENT_SECRET: ci-client-secret
      PAYPAL_WEBHOOK_ID: ci-webhook-id
      PAYPAL_BASE_PLAN_ID: P-CI-BASE
      PAYPAL_PLUS_PLAN_ID: P-CI-PLUS
      PAYPAL_BASE_PLAN_NAME: Base
      PAYPAL_PLUS_PLAN_NAME: Plus
      PAYPAL_BASE_PRICE_CENTS: 800
      PAYPAL_PLUS_PRICE_CENTS: 1200
      PAYPAL_CURRENCY: USD
      PAYPAL_BILLING_INTERVAL: month
      PAYPAL_TRIAL_DAYS: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
